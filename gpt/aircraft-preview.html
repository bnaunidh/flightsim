<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aircraft model preview</title><style>body{margin:0;background:#cbd4da;color:#162b3b;font:16px system-ui}header{position:fixed;top:24px;left:28px;z-index:1}h1{margin:0 0 12px}select,button{font:inherit;padding:10px;border:1px solid #899da9;border-radius:6px;background:white}p{max-width:520px}canvas{display:block}</style><header><h1>Island Flight Simulator</h1><select id="aircraft" aria-label="Aircraft"></select> <button id="angle">Change view</button><p id="stats"></p><p>Procedural aircraft • original game models, lightly refined</p></header><script type="module">
import * as THREE from './island-flight-sim/src/vendor/three.module.js';
import {AIRCRAFT} from './island-flight-sim/src/aircraft/types.js';
import {createAircraftModel} from './island-flight-sim/src/aircraft/model-adapter.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0xcbd4da);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xeef6ff,0x66746a,3));const sun=new THREE.DirectionalLight(0xfff3df,4);sun.position.set(-20,30,-15);scene.add(sun);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.01,1000);
const envScene=new THREE.Scene();envScene.background=new THREE.Color(0x93adbf);envScene.add(new THREE.HemisphereLight(0xffffff,0x566172,2));const top=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshBasicMaterial({color:0xf5f9fc,side:THREE.DoubleSide}));top.position.y=12;top.rotation.x=Math.PI/2;envScene.add(top);const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(envScene).texture;
let model,view=0;const select=document.getElementById('aircraft');for(const t of AIRCRAFT){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;select.append(o);}select.value='courier';
function draw(){if(model)scene.remove(model);const type=AIRCRAFT.find(t=>t.id===select.value);model=createAircraftModel({type});scene.add(model);const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const d=Math.max(size.x,size.z)*1.6;const angles=[[-.85,.42,-1],[1,.2,.35],[0,1.3,.001]];camera.position.copy(center).add(new THREE.Vector3(...angles[view]).multiplyScalar(d));camera.lookAt(center);let tris=0;model.traverse(o=>{if(o.isMesh&&o.visible&&(!o.material.transparent||o.material.opacity>.02))tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3*(o.isInstancedMesh?o.count:1)});document.getElementById('stats').textContent=`${type.name} · ${Math.round(tris).toLocaleString()} triangles · gear and flight physics preserved`;renderer.render(scene,camera);}
select.onchange=draw;document.getElementById('angle').onclick=()=>{view=(view+1)%3;draw()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera)});draw();
</script></html>
