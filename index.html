<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Island Flight Simulator — a browser flight simulator you can install and play offline. Learn to take off, navigate, fly missions and land in any weather.">
  <title>Island Flight Simulator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="assets/fonts/jost-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jost-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="ui" class="ui-root"></div>

  <!-- Loading screen: plain HTML/CSS so it paints before any module loads. -->
  <div id="loading" class="loading">
    <div class="loading-inner">
      <div class="loading-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <path d="M32 6 L36 24 L58 32 L36 40 L32 58 L28 40 L6 32 L28 24 Z" fill="#7cc7ff" opacity="0.95"/>
          <circle cx="32" cy="32" r="5" fill="#0b1220"/>
        </svg>
      </div>
      <h1>Island Flight Simulator</h1>
      <div class="loading-track"><div id="load-bar" class="loading-bar"></div></div>
      <p id="load-msg" class="loading-msg">Starting up…</p>
      <p id="load-tip" class="loading-tip"></p>
      <noscript>
        <p class="loading-msg">This simulator needs JavaScript enabled.</p>
      </noscript>
    </div>
  </div>

  <div id="fatal" class="fatal" hidden></div>

  <script>
    /*
     * The bootstrap (src/core/load-retry.js says why): the game's modules are
     * imported here, and a load that fails — one of the hundreds of module
     * requests dropped on a busy wifi — is tried ONCE more after a short
     * back-off before anything is said. When both tries fail, the screen
     * says so in one calm line and gives a big Reload button (touch-sized),
     * instead of a dead end.
     *
     * window.__bootLoad(importer) is the same code with the importer handed
     * in, so a check can feed it one that fails once, or always
     * (tests/features/load-retry.browser.js). window.__boot records what
     * happened on this load.
     */
    (function () {
      var BACKOFF_MS = 600;
      var RETRIES = 1;
      var boot = (window.__boot = { attempts: 0, retried: false, failed: false, errors: [] });
      // Reload asked for on purpose (a Reload button): the flight guard
      // (main.js 'beforeunload') stands aside, or a broken game would answer
      // the button with the browser's "Leave site?" box.
      window.__reloadPage = function () { window.__leavingOnPurpose = true; location.reload(); };
      function showLoadFailure(err) {
        boot.failed = true;
        var box = document.getElementById('fatal');
        var loading = document.getElementById('loading');
        if (loading) loading.hidden = true;
        if (!box) return;
        box.hidden = false;
        box.innerHTML =
          '<div class="fatal-card">' +
          '<h2>Could not load the game</h2>' +
          '<p class="fatal-line">A file did not arrive — usually the wifi. Reloading fixes it.</p>' +
          '<button type="button" class="fatal-reload" data-fatal-reload>Reload</button>' +
          (location.protocol === 'file:' ? '<p class="tiny">Running from a folder? Play it from its website instead.</p>' : '') +
          '</div>';
        var btn = box.querySelector('[data-fatal-reload]');
        if (btn) btn.addEventListener('click', function () { window.__reloadPage(); });
        if (err) boot.errors.push(String((err && err.message) || err));
        if (window.console && err) console.error('[boot] the game did not load:', err);
      }
      window.__showLoadFailure = showLoadFailure;
      function bootLoad(importer, opts) {
        var o = opts || {};
        var retries = o.retries == null ? RETRIES : o.retries;
        var backoff = o.backoffMs == null ? BACKOFF_MS : o.backoffMs;
        var state = { attempts: 0, retried: false, failed: false, errors: [] };
        var record = o.record || boot;
        function attempt() {
          state.attempts++;
          record.attempts = state.attempts;
          return Promise.resolve().then(importer).catch(function (err) {
            state.errors.push(String((err && err.message) || err));
            record.errors = state.errors.slice();
            if (state.attempts <= retries) {
              state.retried = record.retried = true;
              if (window.console) console.warn('[boot] a game file failed to load; trying again…', err);
              return new Promise(function (r) { setTimeout(r, backoff * state.attempts); }).then(attempt);
            }
            state.failed = record.failed = true;
            if (o.onFail) o.onFail(err); else showLoadFailure(err);
            throw err;
          });
        }
        return attempt().then(function (m) { record.ok = true; return m; });
      }
      window.__bootLoad = bootLoad;
      /*
       * One loading screen, not two (the owner: "fix the double loading
       * screen"). A new version downloaded last time is waiting in the
       * service worker (sw.js no longer takes over by itself). Switch to it
       * now, in the first instant, before the game's long load — not after
       * the menu is up, which reloaded the page and showed the whole loading
       * screen again. Never holds the boot up for more than 2.5 s.
       */
      function switchToWaitingUpdate() {
        var sw = navigator.serviceWorker;
        if (!sw || !sw.controller || !/^https?:$/.test(location.protocol) || /[?&]dev\b/.test(location.search)) return Promise.resolve(false);
        return sw.getRegistration().then(function (reg) {
          if (!reg || !reg.waiting) return false;
          var msg = document.getElementById('load-msg');
          if (msg) msg.textContent = 'Updating to the new version…';
          boot.updatedAtBoot = true;
          return new Promise(function (resolve) {
            var done = false;
            sw.addEventListener('controllerchange', function () {
              if (done) return;
              done = true;
              window.__leavingOnPurpose = true;
              try { sessionStorage.setItem('ifs-updated', '1'); } catch (e) { /* no note, then */ }
              location.reload();
            });
            reg.waiting.postMessage('skip-waiting');
            setTimeout(function () { if (!done) { done = true; resolve(false); } }, 2500);
          });
        }).catch(function () { return false; });
      }
      window.__switchToWaitingUpdate = switchToWaitingUpdate;
      switchToWaitingUpdate().then(function () {
        bootLoad(function () { return import('./src/main.js'); }).catch(function () { /* said on screen */ });
      });
    })();
  </script>
</body>
</html>
