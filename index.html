<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Island Flight Simulator — a browser flight simulator you can install and play offline. Learn to take off, navigate, fly missions and land in any weather.">
  <title>Island Flight Simulator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="ui" class="ui-root"></div>

  <!-- Loading screen: plain HTML/CSS so it paints before any module loads. -->
  <div id="loading" class="loading">
    <div class="loading-inner">
      <div class="loading-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <path d="M32 6 L36 24 L58 32 L36 40 L32 58 L28 40 L6 32 L28 24 Z" fill="#7cc7ff" opacity="0.95"/>
          <circle cx="32" cy="32" r="5" fill="#0b1220"/>
        </svg>
      </div>
      <h1>Island Flight Simulator</h1>
      <div class="loading-track"><div id="load-bar" class="loading-bar"></div></div>
      <p id="load-msg" class="loading-msg">Starting up…</p>
      <p id="load-tip" class="loading-tip"></p>
      <noscript>
        <p class="loading-msg">This simulator needs JavaScript enabled.</p>
      </noscript>
    </div>
  </div>

  <div id="fatal" class="fatal" hidden></div>

  <script type="module" src="src/main.js"></script>
  <script>
    // If the module fails to load at all (very old browser, bad path), say so.
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target.tagName === 'SCRIPT') {
        var box = document.getElementById('fatal');
        if (box) {
          box.hidden = false;
          box.innerHTML = '<h2>Could not load the game</h2><p>A game file failed to load. If you are running it from a folder, start a local web server first — see the README in the source ZIP.</p>';
        }
      }
    }, true);
  </script>
</body>
</html>
